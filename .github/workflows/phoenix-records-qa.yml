name: Phoenix evidence index checks
on:
  pull_request:
    paths:
      - 'phoenix/**'
      - 'data/phoenix-*.json'
      - 'assets/phoenix-*.css'
      - 'assets/phoenix-*.js'
      - 'assets/phoenix-review/**'
      - 'assets/research-detail.css'
      - 'assets/search-print.*'
      - 'assets/search-text.*'
      - 'assets/city-layout.*'
      - 'assets/arizona-landscape.webp'
      - 'data/city-reader-guide.json'
      - 'scripts/city_layout.py'
      - 'scripts/city_reader_guide.py'
      - 'scripts/city_design.py'
      - 'scripts/browser-navigation.mjs'
      - 'scripts/test-approved-site-design.mjs'
      - 'scripts/test-city-reader-journeys.mjs'
      - 'assets/site-search.js'
      - 'assets/reader-tools.css'
      - 'search.html'
      - 'scripts/*phoenix*'
      - 'scripts/test-search-print.mjs'
      - '.github/workflows/phoenix-records-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phoenix-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check-phoenix-records.py
      - name: Use HTTPS Ubuntu package mirrors
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          replacements = {
              'http://azure.archive.ubuntu.com/ubuntu': 'https://archive.ubuntu.com/ubuntu',
              'http://archive.ubuntu.com/ubuntu': 'https://archive.ubuntu.com/ubuntu',
              'http://security.ubuntu.com/ubuntu': 'https://security.ubuntu.com/ubuntu',
          }
          for path in Path('/etc/apt').rglob('*'):
              if path.is_file() and (path.suffix in {'.list', '.sources'} or 'mirrors' in path.name):
                  old = path.read_text()
                  new = old
                  for before, after in replacements.items():
                      new = new.replace(before, after)
                  if old != new:
                      path.write_text(new)
          PYTHON
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - run: node scripts/test-phoenix-index.mjs
      - name: Install PDF text verifier
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/test-search-print.mjs
      - run: node scripts/test-city-reader-journeys.mjs
      - run: node scripts/test-approved-site-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-print-pdfs
          path: /tmp/hap-search-print/*.pdf
          if-no-files-found: ignore

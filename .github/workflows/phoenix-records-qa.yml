name: Phoenix evidence index checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phoenix-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check-phoenix-records.py
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install chromium
      - run: node scripts/test-phoenix-index.mjs
      - run: node scripts/test-phoenix-filters.mjs
      - run: node scripts/test-funding-periods.cjs
      - run: node scripts/test-funding-framework.mjs
      - run: node scripts/test-search-print.mjs
      - run: node scripts/test-city-reader-journeys.mjs
      - run: node scripts/test-approved-site-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-print-pdfs
          path: |
            /tmp/hap-search-print/*.pdf
            /tmp/hap-phoenix-filters/
            /tmp/hap-funding-framework/
          if-no-files-found: ignore

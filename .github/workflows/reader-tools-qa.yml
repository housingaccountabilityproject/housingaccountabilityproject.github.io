name: Reader tools regression checks
on:
  pull_request:
    paths:
      - '_config.yml'
      - '**.html'
      - 'assets/**'
      - 'data/**'
      - 'feed.xml'
      - 'scripts/**'
      - 'requirements-dev.txt'
      - '.github/workflows/reader-tools-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check-list-baseline.py
      - run: python scripts/check-reader-data.py
      - run: python scripts/check-regional-editions.py
      - run: python scripts/check-reader-contrast.py
      - run: node scripts/test-search.cjs
      - run: node scripts/test-category-search.cjs
      - run: python scripts/build-category-search.py
      - run: git diff --exit-code -- assets/category-search-data.js assets/category-search-coverage.js assets/funding-program-names.js
      - name: Ensure generated files are committed
        run: git diff --exit-code -- assets/search-index.js data/search-coverage.json feed.xml
      - name: Build production-equivalent Pages output without deployment
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: .
          destination: ./_site
          future: false
          build_revision: ${{ github.sha }}
      - name: Audit complete PR and production output for retired private references
        run: python scripts/check-regional-release-output.py --retired-ref c95db77ae5325e723aaff097ab636d416b2a28e6 --output _site --report /tmp/hap-release-audit/production-privacy.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-equivalent-audit
          path: |
            /tmp/hap-release-audit/
            _site/
          if-no-files-found: error
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - run: node scripts/test-portable-print.mjs
      - run: node scripts/test-review-print.mjs
      - run: node scripts/test-fragment-navigation.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: portable-print-verified
          path: /tmp/hap-portable-print-verified/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: embedded-review-print-verified
          path: /tmp/hap-review-print-verified/
          if-no-files-found: error
      - run: node scripts/test-list-browser.mjs
      - run: node scripts/test-search-options.mjs
      - run: node scripts/test-category-search.mjs
      - run: node scripts/test-regional-editions.mjs
      - run: node scripts/reader-browser-test.mjs
      - run: node scripts/report-smoke-test.mjs
      - run: node scripts/organization-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-tools-browser-qa
          path: |
            /tmp/hap-category-search/
            /tmp/hap-list-browser/
            /tmp/hap-regional-editions/
            reader-qa-screenshots/
            report-qa-screenshots/
            organization-qa-screenshots/
          if-no-files-found: ignore

name: Inaugural report visual review
on:
  pull_request:
    paths:
      - 'docs/reports/**'
      - 'scripts/report-smoke-test.mjs'
      - '.github/workflows/report-review-qa.yml'
  workflow_dispatch:
jobs:
  report-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate report browser rendering and print layout
        run: node scripts/report-smoke-test.mjs
      - name: Store report QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inaugural-report-visual-qa
          path: report-qa-screenshots/
          if-no-files-found: ignore
